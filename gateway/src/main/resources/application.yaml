server:
  port: 8080

spring:
  application:
    name: Proyecto E-commerce

# CONFIGURACIÓN LOCAL
#
  data:
    redis:
      host: localhost
      port: 6380

# CONFIGURACIÓN VIA DOCKER
#
#  data:
#    redis:
#      host: ${SPRING_REDIS_HOST}
#      port: ${SPRING_REDIS_PORT}

  cloud:
    gateway:

      routes:
        # ==========================
        # AUTH SERVICE
        # ==========================
        - id: auth-service
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/auth/**,/api/support/**
          filters:
            - StripPrefix=1

        # ==========================
        # USER SERVICE
        # ==========================
        - id: user-service
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

